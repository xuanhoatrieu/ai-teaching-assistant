<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Terminal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0c0c0c;
            font-family: 'Consolas', 'Fira Code', 'Courier New', monospace;
            color: #cccccc;
            overflow: hidden;
        }

        .top-bar {
            height: 32px;
            background: #1e1e1e;
            display: flex;
            align-items: center;
            padding: 0 12px;
            border-bottom: 1px solid #333;
        }
        .top-bar .dots {
            display: flex; gap: 6px;
        }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot-red { background: #ff5f57; }
        .dot-yellow { background: #febc2e; }
        .dot-green { background: #28c840; }
        .top-bar .title {
            color: #858585;
            font-size: 13px;
            margin-left: 12px;
        }

        .tab-bar {
            height: 28px;
            background: #1e1e1e;
            display: flex;
            align-items: center;
            padding: 0 8px;
            border-bottom: 1px solid #333;
        }
        .tab {
            padding: 4px 12px;
            font-size: 12px;
            color: #d4d4d4;
            background: #2d2d2d;
            border-radius: 4px 4px 0 0;
        }

        #editor {
            padding: 12px 16px;
            font-size: 16px;
            line-height: 26px;
            color: #cccccc;
            background: #0c0c0c;
            height: calc(100vh - 84px);
            outline: none;
            overflow: auto;
            white-space: pre;
            caret-color: #aeafad;
        }

        .prompt { color: #4ec9b0; }
        .path { color: #569cd6; }

        .status-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 24px;
            background: #007acc;
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 12px;
            color: white;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="dots">
            <span class="dot dot-red"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-green"></span>
        </div>
        <span class="title">Terminal — bash</span>
    </div>

    <div class="tab-bar">
        <div class="tab">⌘ bash</div>
    </div>

    <div id="editor" contenteditable="true" spellcheck="false"><span class="prompt">user@server</span>:<span class="path">~/project</span>$ </div>

    <div class="status-bar">
        <span>bash</span>
        <span style="margin-left:auto;">Terminal</span>
    </div>
</body>
</html>
